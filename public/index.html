<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    .auth input { font: inherit; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; }
    .auth button { font: inherit; font-weight: 700; padding: 10px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth-error { margin: 10px 0 0; color: #ffb4c0; font-size: 15px; }
    .auth-error:empty { display: none; }
    .auth textarea, .note-edit input, .note-edit textarea { font: inherit; padding: 10px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; resize: vertical; }
    .note-edit { display: grid; gap: 8px; }
    .note-actions { display: flex; gap: 8px; margin-top: 12px; }
    li button { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid #51667c; border-radius: 8px; background: transparent; color: #ecf4ff; cursor: pointer; }
    li button.danger { border-color: #d07384; color: #ffb4c0; }
    li button:disabled { opacity: .6; cursor: wait; }
    /* .auth form의 display: grid가 hidden 속성을 덮지 않게 합니다. */
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
    <h1>점령된 자료실</h1>
    <p>로그인한 사용자는 자기 메모만 볼 수 있습니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">메모는 이 사이트의 서버 함수를 통해서만 읽고 씁니다. 자료 저장소로 직접 들어가는 길은 로그인 여부와 관계없이 닫혀 있고, 다른 사람의 메모는 ID를 알더라도 읽기·수정·삭제가 모두 거부됩니다.</div>
    <section class="auth" aria-label="로그인">
      <form id="login-form" hidden>
        <label>이메일 <input id="login-email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="login-password" type="password" autocomplete="current-password" required></label>
        <button type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p>로그인됨: <b id="signed-in-email"></b></p>
        <button id="logout" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert"></p>
    </section>
    <section id="note-section" class="auth" aria-label="메모 추가" hidden>
      <form id="note-form">
        <label>제목 <input id="note-title" type="text" maxlength="200" required></label>
        <label>내용 <textarea id="note-body" rows="3" maxlength="5000"></textarea></label>
        <button type="submit">가상 메모 추가</button>
      </form>
      <p id="note-error" class="auth-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
  </main>
  <!-- 메모 목록은 로그인 세션 토큰이 필요해서 auth.js가 불러옵니다. -->
  <script type="module" src="/auth.js"></script>
</body>
</html>
